name: Verificar disponibilidad de Muroo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar-base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar Render y Supabase
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --show-error --silent --retry 4 --retry-delay 15 --max-time 120 \
            https://muro-colaborativo.onrender.com/api/health)"
          echo "$response" | jq -e '.ok == true and .storage.database == "ready"'
